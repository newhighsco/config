version: 2.1

orbs:
  newhighsco: newhighsco/orb@2.1.1

workflows:
  version: 2
  test_and_release:
    jobs:
      - newhighsco/setup:
          name: setup
      - newhighsco/test:
          name: test
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            yarn test
          context:
            - release
          requires:
            - setup
      - newhighsco/release:
          name: release
          command: yarn multi-semantic-release
          context:
            - release
          requires:
            - test
          filters:
            branches:
              only:
                - main
