version: 2.1

orbs:
  newhighsco: newhighsco/orb@2.1.2

workflows:
  version: 2
  test_and_release:
    jobs:
      - newhighsco/setup:
          name: setup
      - newhighsco/test:
          name: test
          command: |
            git config --global http.https://github.com/.extraheader "Authorization: Basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            yarn test
          context:
            - release
          requires:
            - setup
      - newhighsco/release:
          name: release
          command: yarn multi-semantic-release
          context:
            - release
          requires:
            - test
          filters:
            branches:
              only:
                - main
